<!DOCTYPE html>
<!--
  [INPUT]: 依赖 build/Mado.icon 导出的 build/icon-1024.png 当前应用图标
  [OUTPUT]: 对外提供当前 1024px 应用图标的本地预览页
  [POS]: 根模块的图标预览入口，设计真源在 build/Mado.icon，历史备份位于 build/
  [PROTOCOL]: 变更时更新此头部，然后检查 AGENTS.md
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Mado Icon</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #171612; }
    img { width: min(82vmin, 1024px); height: min(82vmin, 1024px); object-fit: contain; }
  </style>
</head>
<body>
  <img src="build/icon-1024.png" alt="Mado 应用图标">
</body>
</html>
